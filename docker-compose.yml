services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quizforge
      POSTGRES_USER: quizforge
      POSTGRES_PASSWORD: quizforge
    volumes:
      - quizforge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://quizforge:quizforge@db:5432/quizforge
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
      DEFAULT_INSTRUCTOR_EMAIL: ${DEFAULT_INSTRUCTOR_EMAIL:-instructor@example.com}
      DEFAULT_INSTRUCTOR_PASSWORD: ${DEFAULT_INSTRUCTOR_PASSWORD:-change-me-123}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  quizforge_data:

